[project]
name = "spmc-backend"
version = "1.0.0"
description = "Solar Panel Monitoring & Control backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "pysolar>=0.11",
]

[project.optional-dependencies]
# Raspberry Pi only: GPIO, I2C power monitor, DHT11 and Arduino serial drivers.
hardware = [
    "gpiod>=2.1",
    "RPi.GPIO>=0.7",
    "pi-ina219>=1.4",
    "adafruit-circuitpython-dht>=4.0",
    "pyserial>=3.5",
]

[tool.uv]
package = false
